name: maplibre_flutter_gpu
description: >-
  MapLibre maps for Flutter, rendered with Flutter GPU.
version: 0.0.3
repository: https://github.com/hyshu/maplibre_flutter_gpu
homepage: https://github.com/hyshu/maplibre_flutter_gpu
issue_tracker: https://github.com/hyshu/maplibre_flutter_gpu/issues
topics:
  - maplibre
  - map
  - flutter-gpu

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  archive: ^4.0.7
  code_assets: ^1.2.1
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  vector_math: ^2.2.0
  ffi: ^2.1.0
  hooks: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.maplibre.fluttergpu
        pluginClass: MaplibreFlutterGpuPlugin
      ios:
        pluginClass: MaplibreFlutterGpuPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MaplibreFlutterGpuPlugin
        sharedDarwinSource: true
  assets:
    - assets/shaderbundles/
