name: Bug report
description: Report a reproducible problem in MapLibre Flutter GPU.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting a report. Use the Android compatibility form for general Android device results.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Map creation and lifecycle
        - Rendering
        - Symbols, text, and Flutter widgets
        - Gestures and camera
        - Style, source, and layer APIs
        - Custom Flutter GPU rendering
        - Build, installation, and native artifacts
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Enter the published version or Git commit SHA.
      placeholder: 0.0.3
    validations:
      required: true

  - type: textarea
    id: flutter-version
    attributes:
      label: Flutter version
      description: Paste the output of `flutter --version`.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - macOS
        - Windows x64
        - Windows ARM64
        - Linux x64
        - Linux ARM64
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS version, device or machine, CPU architecture, GPU, driver, and renderer backend when relevant.
    validations:
      required: true

  - type: dropdown
    id: build-mode
    attributes:
      label: Build mode
      options:
        - Debug
        - Profile
        - Release
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable example. Link a public reproduction repository when possible.
      placeholder: |
        1. Create a map with...
        2. Move the camera to...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and stack traces
      description: Add relevant logs. Drag screenshots or videos into this field when useful.
      render: shell

  - type: input
    id: last-working-version
    attributes:
      label: Last known working version
      description: Leave blank if unknown or if the problem has always occurred.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed API keys, access tokens, private URLs, and personal data.
          required: true
