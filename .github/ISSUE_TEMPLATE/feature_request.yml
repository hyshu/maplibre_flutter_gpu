name: Feature request
description: Suggest an API, platform, or rendering improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain what you want to build and what blocks you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior or API
      description: Describe the desired result. Include a small Dart API example when relevant.
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Target platforms
      options:
        - label: Android
        - label: iOS
        - label: macOS
        - label: Windows
        - label: Linux

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note related MapLibre Native behavior, upstream issues, or breaking API changes.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute this change?
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
