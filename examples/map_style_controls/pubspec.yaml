name: maplibre_flutter_map_style_controls_example
description: Semantic map style controls using the MapLibre controller API.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  maplibre_flutter_gpu:
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
